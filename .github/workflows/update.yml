name: Check for updates

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  manifests:
    runs-on: ubuntu-latest
    outputs:
      manifests: ${{ steps.list.outputs.manifests }}
    steps:
      - uses: actions/checkout@v7

      - id: list
        run: echo "manifests=$(printf '%s\n' */*.yml | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  check:
    needs: manifests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest: ${{ fromJSON(needs.manifests.outputs.manifests) }}
    steps:
      # Saved credentials would override the app token create-pull-request pushes with.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Pull requests opened with GITHUB_TOKEN wait for approval before build.yml runs on them.
      # Opening them as the app starts it straight away.
      - id: app
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # Force-pushing an update branch made from an older master changes any workflow files master changed since.
          permission-workflows: write

      # Only commit here: the checker names branches after the tree hash, so each version would get its own PR.
      - uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        env:
          GIT_AUTHOR_NAME: craftum-renovate-bot[bot]
          GIT_COMMITTER_NAME: craftum-renovate-bot[bot]
          GIT_AUTHOR_EMAIL: 226380229+craftum-renovate-bot[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 226380229+craftum-renovate-bot[bot]@users.noreply.github.com
        with:
          args: --commit-only ${{ matrix.manifest }}

      # The checker runs as root, so later steps can't write to what it left in .git.
      # It also leaves its commit on a local update-master-<hash> branch, which create-pull-request would take as the base.
      - run: |
          sudo chown -R "$(id -u):$(id -g)" .
          git checkout -B master

      - id: meta
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: |
          echo "app=$(dirname "$MANIFEST")" >> "$GITHUB_OUTPUT"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]; then
            echo "title=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"
            {
              echo "body<<EOF_BODY"
              git log -1 --format=%b
              echo "EOF_BODY"
            } >> "$GITHUB_OUTPUT"
          fi

      # One branch per app, force-pushed with the newest version, so its PR gets updated in place.
      - if: steps.meta.outputs.title != ''
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app.outputs.token }}
          branch: update/${{ steps.meta.outputs.app }}
          base: master
          title: ${{ steps.meta.outputs.title }}
          body: ${{ steps.meta.outputs.body }}
          author: craftum-renovate-bot[bot] <226380229+craftum-renovate-bot[bot]@users.noreply.github.com>
          committer: craftum-renovate-bot[bot] <226380229+craftum-renovate-bot[bot]@users.noreply.github.com>
