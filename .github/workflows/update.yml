name: Check for updates

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  manifests:
    runs-on: ubuntu-latest
    outputs:
      manifests: ${{ steps.list.outputs.manifests }}
    steps:
      - uses: actions/checkout@v7

      - id: list
        run: echo "manifests=$(printf '%s\n' */*.yml | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  check:
    needs: manifests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        manifest: ${{ fromJSON(needs.manifests.outputs.manifests) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        env:
          GIT_AUTHOR_NAME: Flatpak External Data Checker
          GIT_COMMITTER_NAME: Flatpak External Data Checker
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --update --never-fork ${{ matrix.manifest }}

  # Bot pull requests don't start pull_request workflows, so the required build is started here.
  build:
    needs: check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      pull-requests: read
      statuses: write
    steps:
      - name: Build the update branches that have no checks yet
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list --state open --limit 100 --json headRefName,headRefOid,statusCheckRollup --jq \
            '.[] | select((.headRefName | startswith("update-master-")) and (.statusCheckRollup | length == 0))
              | "\(.headRefName) \(.headRefOid)"' |
          while read -r branch sha; do
            gh api "repos/$GH_REPO/statuses/$sha" -f context=flatpak-builder -f state=pending
            gh workflow run build.yml --ref "$branch"
          done
