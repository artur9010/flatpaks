name: Publish

on:
  push:
    branches: [master]

concurrency:
  group: publish
  cancel-in-progress: false

env:
  FLATHUB_REPO: https://dl.flathub.org/repo/flathub.flatpakrepo
  SITE_URL: https://flatpaks.motyka.pro

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outputs.built }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')
          test -n "$key"
          echo "GPG_KEY_ID=$key" >> "$GITHUB_ENV"

      # The bucket holds the Flatpak repository (repo/) and a hash of each app it was built from (built/).
      - name: Download the published repository
        uses: docker://rclone/rclone:1.75.2
        env: &rclone
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://41808471c3221d715a79106b57dec21b.eu.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        with:
          args: sync r2:flatpaks site --checksum --fast-list

      - name: Build the apps that changed
        id: build
        run: |
          flatpak remote-add --user --if-not-exists flathub "$FLATHUB_REPO"
          mkdir -p dist site/built

          # Object storage has no empty folders, and OSTree needs these to exist.
          if [ -d site/repo ]; then
            mkdir -p site/repo/refs/heads site/repo/refs/mirrors site/repo/refs/remotes \
              site/repo/state site/repo/tmp/cache site/repo/extensions
          fi

          # An app that was deleted has to leave the repository: start again without it.
          for stamp in site/built/*; do
            if [ -e "$stamp" ] && [ ! -d "$(basename "$stamp")" ]; then
              rm -rf site/repo site/built
              mkdir site/built
              break
            fi
          done

          for manifest in */*.yml; do
            app=$(dirname "$manifest")
            hash=$(find "$app" -type f | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
            if [ -d site/repo ] && [ "$(cat "site/built/$app" 2> /dev/null)" = "$hash" ]; then
              echo "$app is unchanged"
              continue
            fi
            flatpak-builder --user --disable-rofiles-fuse --force-clean \
              --install-deps-from=flathub --default-branch=stable \
              --repo=site/repo --gpg-sign="$GPG_KEY_ID" \
              "build/$app" "$manifest"
            flatpak build-bundle --runtime-repo="$FLATHUB_REPO" \
              site/repo "dist/$app.flatpak" "$app" stable
            echo "$hash" > "site/built/$app"
            echo "built=true" >> "$GITHUB_OUTPUT"
          done

      - name: Update the repository
        if: steps.build.outputs.built == 'true'
        run: |
          flatpak build-update-repo --gpg-sign="$GPG_KEY_ID" \
            --title="artur9010 flatpaks" --default-branch=stable \
            --generate-static-deltas --prune --prune-depth=2 site/repo
          gpg --armor --export "$GPG_KEY_ID" > site/repo/signing-key.asc
          cat > site/repo/artur9010.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=artur9010 flatpaks
          Url=$SITE_URL/repo/
          Homepage=https://github.com/artur9010/flatpaks
          RuntimeRepo=$FLATHUB_REPO
          GPGKey=$(gpg --export "$GPG_KEY_ID" | base64 --wrap=0)
          EOF

      # New objects first and the summary after them, so no client sees a version whose files
      # aren't there yet. The hashes go last, so a failed upload is retried on the next push.
      - name: Upload the objects
        if: steps.build.outputs.built == 'true'
        uses: docker://rclone/rclone:1.75.2
        env: *rclone
        with:
          args: copy site r2:flatpaks --checksum --fast-list --exclude /repo/summary* --exclude /built/**

      - name: Upload the summary
        if: steps.build.outputs.built == 'true'
        uses: docker://rclone/rclone:1.75.2
        env: *rclone
        with:
          args: copy site r2:flatpaks --checksum --fast-list --include /repo/summary*

      - name: Upload the hashes and remove old objects
        if: steps.build.outputs.built == 'true'
        uses: docker://rclone/rclone:1.75.2
        env: *rclone
        with:
          args: sync site r2:flatpaks --checksum --fast-list

      - uses: actions/upload-artifact@v7
        if: steps.build.outputs.built == 'true'
        with:
          name: bundles
          path: dist/*.flatpak
          compression-level: 0

  release:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: bundles
          path: dist

      - name: Publish the bundles to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for bundle in dist/*.flatpak; do
            app=$(basename "$bundle" .flatpak)
            version=$(sed -n 's/.*<release version="\([^"]*\)".*/\1/p' "$app/$app.metainfo.xml" | head -n 1)
            test -n "$version"
            tag="$app-$version"
            if gh release view "$tag" > /dev/null 2>&1; then
              gh release upload "$tag" "$bundle" --clobber
            else
              gh release create "$tag" "$bundle" --target "$GITHUB_SHA" \
                --title "$app $version" --notes "Built from $GITHUB_SHA."
            fi
          done
