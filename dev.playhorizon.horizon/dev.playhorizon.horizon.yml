app-id: dev.playhorizon.horizon
# The SDK, not the Platform: native mods compile the game on the player's computer, and the
# launcher needs cc, the C headers, pkg-config, and ALSA's and libudev's development files.
runtime: org.freedesktop.Sdk
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: horizon-launcher
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  # The game's clipboard (arboard) uses the data-control protocol, which compositors hide
  # from sandboxed apps, and then falls back to X11 through XWayland
  - --socket=x11
  - --socket=pulseaudio
  # GPU, and controllers: gilrs reads /dev/input, DualSense rumble and lights need /dev/hidraw*
  - --device=all
  # The launcher prepares the game from the player's own Minecraft install
  - --filesystem=~/.minecraft:ro
  # Discord Rich Presence
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
  # /app is read-only: updates come through Flatpak, the launcher must not replace itself
  - --env=HORIZON_LAUNCHER_NO_SELF_UPDATE=1
modules:
  - name: horizon-launcher
    buildsystem: simple
    build-commands:
      - install -Dm755 horizon-launcher ${FLATPAK_DEST}/bin/horizon-launcher-bin
      - install -Dm755 horizon-launcher.sh ${FLATPAK_DEST}/bin/horizon-launcher
      - install -Dm644 horizon-launcher.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      # The game's window has the Wayland app id "horizon"; this hidden entry gives it its icon
      - install -Dm644 horizon.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.game.desktop
      - install -Dm644 horizon.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -Dm644 horizon.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dm644 LICENSE -t ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}
      - desktop-file-edit --set-icon=${FLATPAK_ID} ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-icon=${FLATPAK_ID} --set-key=Exec --set-value=horizon-launcher
        ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.game.desktop
    sources:
      # The release build, not a source build: Microsoft sign-in and CurseForge need the
      # client id and API key that only the project's release workflow builds in.
      - type: archive
        url: https://github.com/horizon-rust/horizon/releases/download/launcher%400.2.60/horizon-launcher-linux-x86_64.tar.gz
        sha256: 094960e1c268f63aee8aca36a9c3079875b7ea12625e8179c292e0bd8290ae52
        strip-components: 0
        only-arches:
          - x86_64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/horizon-rust/horizon/releases?per_page=100
          version-query: '[.[] | select(.tag_name | startswith("launcher@"))][0].tag_name
            | sub("^launcher@"; "")'
          url-query: '[.[] | select(.tag_name | startswith("launcher@"))][0].assets[]
            | select(.name == "horizon-launcher-linux-x86_64.tar.gz") | .browser_download_url'
          is-main-source: true
      - type: file
        url: https://raw.githubusercontent.com/horizon-rust/horizon/6d586e2b2368e1bcc6e312cbdf51565cf7e3730b/packaging/linux/horizon-launcher.desktop
        sha256: 436447e5ce86e144d744cf8f0e57aaeb2fe7f16e35cf62f4a3c7a56b0b0ddf31
      - type: file
        url: https://raw.githubusercontent.com/horizon-rust/horizon/6d586e2b2368e1bcc6e312cbdf51565cf7e3730b/packaging/linux/horizon.desktop
        sha256: f0121d7dbed19084e799d6628628115b4e7140f984e078c058ddc35c179b7518
      - type: file
        url: https://raw.githubusercontent.com/horizon-rust/horizon/6d586e2b2368e1bcc6e312cbdf51565cf7e3730b/packaging/icons/hicolor/512x512/apps/horizon.png
        sha256: fefb808a16c99ce04bb77ffae561548603a6776db8d7d71e76becea3411285a1
      - type: file
        url: https://raw.githubusercontent.com/horizon-rust/horizon/6d586e2b2368e1bcc6e312cbdf51565cf7e3730b/packaging/icons/hicolor/scalable/apps/horizon.svg
        sha256: 2a8c0871ae8a1fc4d3be47c8ce187ee5411d9553da241411ddd7e75c61373eb3
      - type: file
        url: https://raw.githubusercontent.com/horizon-rust/horizon/6d586e2b2368e1bcc6e312cbdf51565cf7e3730b/LICENSE
        sha256: b4b374ae9d0f2d8f7be35c6783e41327431da3b5662605da9ba31493630621df
